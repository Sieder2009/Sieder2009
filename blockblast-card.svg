  <style>.m{font-family:'JetBrains Mono','Fira Code','Cascadia Code',Consolas,'Courier New',monospace}.s{font-family:'Segoe UI',Helvetica,Arial,sans-serif}.pop{transform-box:fill-box;transform-origin:center;animation:pop 2.4s ease-in-out infinite}.p2{animation-delay:.25s}.p3{animation-delay:.5s}.p4{animation-delay:.75s}@keyframes pop{0%,40%,100%{transform:scale(1)}20%{transform:scale(.6)}}@media (prefers-reduced-motion:reduce){.pop{animation:none}}</style>
