<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Sieder – Ironpeak" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1330"/>
      <stop offset="0.6" stop-color="#2a1f45"/>
      <stop offset="1" stop-color="#5a2d4a"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd28a"/>
      <stop offset="0.55" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#ff5e3a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ridgeLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5e3a"/>
      <stop offset="0.68" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#ff5e3a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .sun   { animation: rise 2.4s cubic-bezier(.2,.7,.2,1) 0.2s both; }
      .halo  { animation: pulse 4s ease-in-out 2.6s infinite; transform-origin: 820px 150px; }
      .line  { stroke-dasharray: 1; stroke-dashoffset: 0; animation: draw 2.6s ease-in-out 0.4s both; }
      .flag  { animation: pop 0.5s ease-out 3s both; }
      .cloth { animation: wave 1.6s ease-in-out 3.5s infinite; transform-origin: 822px 72px; }
      .name  { animation: slide 1s cubic-bezier(.2,.7,.2,1) 1.2s both; }
      .sub   { animation: fade 1s ease-out 2s both; }
      .star  { animation: twinkle 3s ease-in-out infinite; }
      @keyframes rise   { from { transform: translateY(190px); } to { transform: translateY(0); } }
      @keyframes pulse  { 0%,100% { opacity: .55; transform: scale(1); } 50% { opacity: .85; transform: scale(1.06); } }
      @keyframes draw   { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
      @keyframes pop    { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes wave   { 0%,100% { transform: skewY(0deg) scaleX(1); } 50% { transform: skewY(-6deg) scaleX(.9); } }
      @keyframes slide  { from { opacity: 0; transform: translateX(-40px); } to { opacity: 1; transform: translateX(0); } }
      @keyframes fade   { from { opacity: 0; } to { opacity: 1; } }
      @keyframes twinkle{ 0%,100% { opacity: .9; } 50% { opacity: .25; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <rect width="1200" height="360" fill="url(#sky)"/>

  <g fill="#f2efe8">
    <circle class="star" cx="110" cy="40"  r="1.6"/>
    <circle class="star" cx="260" cy="70"  r="1.2" style="animation-delay:.8s"/>
    <circle class="star" cx="420" cy="30"  r="1.4" style="animation-delay:1.6s"/>
    <circle class="star" cx="610" cy="60"  r="1.1" style="animation-delay:.4s"/>
    <circle class="star" cx="990" cy="45"  r="1.5" style="animation-delay:1.2s"/>
    <circle class="star" cx="1120" cy="90" r="1.2" style="animation-delay:2s"/>
    <circle class="star" cx="700" cy="25"  r="1.3" style="animation-delay:2.4s"/>
  </g>

  <g class="sun">
    <circle class="halo" cx="820" cy="150" r="150" fill="url(#sun)" opacity=".55"/>
    <circle cx="820" cy="150" r="62" fill="#ffc46b"/>
  </g>

  <!-- back range -->
  <path d="M0 300 L90 270 L170 285 L260 240 L350 262 L450 205 L560 238 L650 175 L740 215 L880 150 L990 205 L1080 185 L1200 230 L1200 360 L0 360 Z" fill="#241c3f" opacity=".85"/>

  <!-- front ridge = progress curve -->
  <path d="M0 330 L120 300 L200 315 L300 270 L380 285 L470 230 L540 250 L630 190 L700 210 L820 110 L900 190 L960 170 L1060 240 L1200 210 L1200 360 L0 360 Z" fill="#0b0e1f"/>
  <path class="line" pathLength="1" d="M0 330 L120 300 L200 315 L300 270 L380 285 L470 230 L540 250 L630 190 L700 210 L820 110 L900 190 L960 170 L1060 240 L1200 210"
        fill="none" stroke="url(#ridgeLine)" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow)"/>

  <!-- summit flag -->
  <g class="flag">
    <line x1="820" y1="110" x2="820" y2="62" stroke="#f2efe8" stroke-width="2.5" stroke-linecap="round"/>
    <path class="cloth" d="M822 62 L856 72 L822 82 Z" fill="#ff5e3a"/>
  </g>

  <g class="name">
    <text x="60" y="165" font-family="Impact, 'Anton', 'Oswald', 'Arial Narrow Bold', 'Arial Black', sans-serif"
          font-size="112" letter-spacing="6" fill="#f2efe8">SIEDER</text>
  </g>
  <text class="sub" x="64" y="208" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#b9c3d9">
    Ich baue die Apps, mit denen ich selbst trainiere.
  </text>
</svg>
