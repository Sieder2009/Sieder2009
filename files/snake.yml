name: Gipfel-Snake

on:
  schedule:
    - cron: "0 */12 * * *"   # alle 12 Stunden neu erzeugen
  workflow_dispatch:           # manuell starten über den Actions-Tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Snake aus den Contributions erzeugen
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#ff5e3a&color_dots=#1c2244,#3b3570,#7a3e6e,#d9644a,#ffb347

      - name: Auf den Branch "output" veröffentlichen
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
