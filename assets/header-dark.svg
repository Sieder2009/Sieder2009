      <stop offset=".45" stop-color="#8b5cf6" stop-opacity="0.279"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1.1" fill="#f0f6fc" fill-opacity="0.16"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset=".3" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff"/>
    </linearGradient>
    <mask id="mask"><rect width="846" height="250" fill="url(#fade)"/></mask>
  </defs>
  <rect x="11" y="6" width="824" height="238" rx="16" fill="#0d1117"/>
