<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 846 250" width="846" height="250" role="img" aria-labelledby="t">
  <title id="t">Sieder – Flutter- &amp; Web-Entwickler. Aktuell: Ironpeak Fitness</title>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
    .a{animation:a 17s ease-in-out infinite}
    .b{animation:b 21s ease-in-out infinite}
    .c{animation:c 25s ease-in-out infinite}
    .float{animation:float 6s ease-in-out infinite}
    .ping{transform-box:fill-box;transform-origin:center;animation:ping 2.4s cubic-bezier(0,0,.2,1) infinite}
    @keyframes a{50%{transform:translate(-40px,26px)}}
    @keyframes b{50%{transform:translate(-56px,-18px)}}
    @keyframes c{50%{transform:translate(48px,-28px)}}
    @keyframes float{50%{transform:translateY(-7px)}}
    @keyframes ping{0%{transform:scale(1);opacity:.7}80%,100%{transform:scale(2.8);opacity:0}}
    @media (prefers-reduced-motion:reduce){.a,.b,.c,.float,.ping{animation:none}.ping{opacity:0}}
  </style>
  <defs>
    <clipPath id="clip"><rect x="11" y="6" width="824" height="238" rx="16"/></clipPath>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <radialGradient id="g0">
      <stop offset="0" stop-color="#1fa76a" stop-opacity="0.62"/>
      <stop offset=".45" stop-color="#1fa76a" stop-opacity="0.279"/>
      <stop offset="1" stop-color="#1fa76a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g1">
      <stop offset="0" stop-color="#2f9bb8" stop-opacity="0.62"/>
      <stop offset=".45" stop-color="#2f9bb8" stop-opacity="0.279"/>
      <stop offset="1" stop-color="#2f9bb8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2">
