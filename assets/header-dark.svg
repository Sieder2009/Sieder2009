        <rect width="46" height="46" rx="12.0" fill="#2f9bb8"/>
        <rect x=".5" y=".5" width="45" height="45" rx="12.0" fill="none" stroke="#fff" stroke-opacity=".22"/>
        <g transform="translate(10.579999999999998 10.579999999999998) scale(1.0350000000000001)" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7l8.7 5l8.7-5M12 22V12"/></g>
