  <text x="58" y="139" font-size="22" fill="#9198a1">Flutter- &amp; Web-Entwickler</text>
  <rect x="58.5" y="165.5" width="213" height="31" rx="15.5" fill="#0d1117" fill-opacity=".6" stroke="#3d444d"/>
  <circle cx="77" cy="181" r="4.5" fill="#38d08f"/>
  <circle class="ping" cx="77" cy="181" r="4.5" fill="none" stroke="#38d08f" stroke-width="1.5"/>
  <text x="91" y="186" font-size="15" fill="#9198a1" textLength="164" lengthAdjust="spacingAndGlyphs">Aktuell: <tspan fill="#f0f6fc" font-weight="600">Ironpeak Fitness</tspan></text>
