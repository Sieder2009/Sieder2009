name: Profil-Grafiken

on:
  schedule:
    - cron: "0 */12 * * *"   # alle 12 Stunden neu erzeugen
  workflow_dispatch:           # manuell starten über den Actions-Tab
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: profil-grafiken
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Snake aus den Contributions erzeugen
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#ffcb6b&color_dots=#1a2340,#123a5c,#1a6194,#2b8fd0,#40c4ff
            dist/snake-light.svg?palette=github-light&color_snake=#ff6d00&color_dots=#ebedf0,#b3e5fc,#4fc3f7,#0398dc,#01579b

      # Falls die Statistik unten scheitert, bleibt so die letzte funktionierende Karte online
      - name: Letzte Statistik-Karte als Reserve holen
        run: curl -sf "https://raw.githubusercontent.com/${{ github.repository }}/output/stats.svg" -o dist/stats.svg || true

      - name: Statistik-Karte erzeugen
        continue-on-error: true
        run: node .github/scripts/stats.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_LOGIN: ${{ github.repository_owner }}

      - name: Auf den Branch "output" veröffentlichen
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
