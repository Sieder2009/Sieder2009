name: Profil-Grafiken

on:
  schedule:
    - cron: "0 */12 * * *"   # alle 12 Stunden neu erzeugen
  workflow_dispatch:           # manuell starten über den Actions-Tab
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: profil-grafiken
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Snake aus den Contributions erzeugen
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#a371f7&color_dots=#151b23,#15603f,#188a58,#22b072,#4fdc9a
            dist/snake-light.svg?palette=github-light&color_snake=#8250df&color_dots=#eff2f5,#78c59c,#3fa874,#1a8456,#0b5838

      # Falls die Statistik unten scheitert, bleiben so die letzten funktionierenden Kacheln online
      - name: Letzte Statistik-Kacheln als Reserve holen
        run: |
          for f in stats-kpis-dark stats-kpis-light stats-months-dark stats-months-light; do
            curl -sf "https://raw.githubusercontent.com/${{ github.repository }}/output/$f.svg" -o "dist/$f.svg" || true
          done

      - name: Statistik-Kacheln erzeugen
        continue-on-error: true
        run: node .github/scripts/stats.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_LOGIN: ${{ github.repository_owner }}

      - name: Auf den Branch "output" veröffentlichen
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
